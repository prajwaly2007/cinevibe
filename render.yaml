services:
  # CineVibe FastAPI Backend Service
  - type: web
    name: cinevibe-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: PORT
        value: 10000

  # CineVibe Frontend Static Site
  - type: web
    name: cinevibe-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cinevibe-backend
          property: host
