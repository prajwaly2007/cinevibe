services:
  # 1. CineVibe FastAPI Backend Service
  - type: web
    name: cinevibe-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TMDB_API_KEY
        value: 4e44d9029b1270a757cddc766a1bcb63

  # 2. CineVibe React Frontend (Static Site)
  - type: web
    name: cinevibe-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cinevibe-backend
          envVarKey: RENDER_EXTERNAL_URL
